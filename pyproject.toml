[project]
name = "game"
version = "0.0.1"
description = ""
authors = [
    {name = "Ludwik Bielczynski", email = "ludwik.bielczynski@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.0",
    "numpy>=2.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "black>=24.8.0",
    "isort>=5.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game"]
